name = "strictcode-registry"
meta_version = 1
format_version = 2
document_syntax = "json"
role = "schema"
root = "Registry"
targets = ["go"]
description = "Validates schema/registry.json: the committed rule-registry dump (rules, groups, and retired-rule records; see the rules page in stricttools/docs/rules.md). The release diff classifies version bumps from this artifact, and the docs site renders its rule and support-matrix tables from it. Capability enums are sourced from schema/vocabulary.toml (strictspec decision 32)."

[types.Registry]
type = "record"

[types.Registry.fields.languages]
type = "array"
required = true
min_len = 1
description = "The languages of the support matrix, in column order, with the display names from their profiles."
[types.Registry.fields.languages.item]
type = "LanguageDecl"

[types.Registry.fields.rules]
type = "array"
required = true
min_len = 1
[types.Registry.fields.rules.item]
type = "RuleDecl"

[types.Registry.fields.groups]
type = "map"
required = true
key_pattern = "^[a-z][a-z0-9-]*$"
order = "incidental"
[types.Registry.fields.groups.value]
type = "array"
[types.Registry.fields.groups.value.item]
type = "RuleId"

[types.Registry.fields.tombstones]
type = "array"
required = true
[types.Registry.fields.tombstones.item]
type = "TombstoneDecl"

[[types.Registry.constraints]]
form = "unique-by"
collection = "rules"
field = "id"
normalization = "none"

[[types.Registry.constraints]]
form = "unique-by"
collection = "tombstones"
field = "id"
normalization = "none"

[types.LanguageDecl]
type = "record"

[types.LanguageDecl.fields.id]
type = "enum"
required = true
values = ["py", "go", "ts"]

[types.LanguageDecl.fields.display_name]
type = "string"
required = true
non_empty = true

[types.RuleId]
type = "string"
regex = "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
description = "A minted rule identifier: flat, lowercase, hyphenated, encoding nothing."

[types.CapabilityId]
type = "enum"
description = "Sourced from the vocabulary (capabilities)."
[types.CapabilityId.source]
document = "schema/vocabulary.toml"
selector = "capabilities[].id"
baked = [
  "module-enumeration",
  "import-extraction",
  "resolve-imports-internal",
  "resolve-imports-modules",
  "import-attr-guarded",
  "import-attr-type-checking",
  "test-context-classification",
  "entry-point-discovery",
  "declared-dependency-extraction",
  "export-extraction",
  "callable-extraction",
  "type-extraction",
  "call-resolution-syntactic",
  "call-resolution-type-informed",
  "conformance-declared",
  "conformance-derived",
  "instantiation-extraction",
  "reference-extraction",
  "decoration-extraction",
  "unreachable-statement-analysis",
  "endpoint-discovery",
  "db-entity-discovery",
]

[types.RuleDecl]
type = "record"

[types.RuleDecl.fields.id]
type = "RuleId"
required = true

[types.RuleDecl.fields.severity]
type = "enum"
required = true
values = ["error", "warning"]

[types.RuleDecl.fields.description]
type = "string"
required = true
non_empty = true

[types.RuleDecl.fields.requires]
type = "array"
required = true
[types.RuleDecl.fields.requires.item]
type = "CapabilityId"

[types.RuleDecl.fields.uses]
type = "array"
required = true
[types.RuleDecl.fields.uses.item]
type = "CapabilityId"

[types.RuleDecl.fields.groups]
type = "array"
required = true
[types.RuleDecl.fields.groups.item]
type = "string"
regex = "^[a-z][a-z0-9-]*$"

[types.RuleDecl.fields.suppression]
type = "enum"
required = true
values = ["none", "path", "project-dep", "member-set", "member"]
description = "The rule's suppression target shape (see stricttools/docs/config.md)."

[types.RuleDecl.fields.fix_tier]
type = "integer"
required = true
min = 1
max = 3

[types.RuleDecl.fields.planned_fixes]
type = "array"
required = true
[types.RuleDecl.fields.planned_fixes.item]
type = "PlannedFixDecl"

[types.RuleDecl.fields.not_applicable]
type = "map"
required = true
key_pattern = "^(py|go|ts)$"
order = "incidental"
[types.RuleDecl.fields.not_applicable.value]
type = "string"
non_empty = true

[types.RuleDecl.fields.language_independent]
type = "boolean"
required = true
description = "True when the rule engages no language capability (it is evaluated against config, disk, and the registry), so it applies to every project and has no per-language support cells."

[types.RuleDecl.fields.support]
type = "map"
required = true
key_pattern = "^(py|go|ts)$"
order = "incidental"
description = "The computed support-matrix cell per language, from the requires/uses capability model, the language profiles, and the rule's not_applicable overrides. Empty if and only if language_independent is true."
[types.RuleDecl.fields.support.value]
type = "SupportCell"

[types.SupportCell]
type = "record"

[types.SupportCell.fields.status]
type = "enum"
required = true
values = ["supported", "planned", "n/a"]

[types.SupportCell.fields.reason]
type = "string"
required = false
non_empty = true
description = "Why the rule is not applicable in this language. Present if and only if status is n/a."

[[types.SupportCell.constraints]]
form = "conditional-required"
field = "reason"
when = { field = "status", predicate = "equals", value = "n/a" }

[[types.SupportCell.constraints]]
form = "forbidden-when"
field = "reason"
when = { field = "status", predicate = "in", values = ["supported", "planned"] }

[types.PlannedFixDecl]
type = "record"

[types.PlannedFixDecl.fields.tier]
type = "integer"
required = true
min = 1
max = 2

[types.PlannedFixDecl.fields.description]
type = "string"
required = true
non_empty = true

[types.TombstoneDecl]
type = "record"

[types.TombstoneDecl.fields.id]
type = "RuleId"
required = true

[types.TombstoneDecl.fields.retired_in]
type = "string"
required = true
non_empty = true

[types.TombstoneDecl.fields.reason]
type = "string"
required = true
non_empty = true

[types.TombstoneDecl.fields.replaced_by]
type = "array"
required = true
[types.TombstoneDecl.fields.replaced_by.item]
type = "RuleId"

[types.TombstoneDecl.fields.migration]
type = "string"
required = true
non_empty = true

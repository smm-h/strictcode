name = "strictcode-config"
meta_version = 1
format_version = 1
document_syntax = "toml"
role = "schema"
root = "Config"
targets = ["go"]
description = "Validates strictcode.toml, the declarations file (see stricttools/docs/config.md): analysis modes; per-rule thresholds and allow lists; suppressions in each rule's declared shape, each with a mandatory reason; the Python tool declarations; and the strictspec certificate declaration. It switches nothing: whether a rule runs, and at which severity, is its strictcode:<rule id> option. Rule-ID validity (a retired rule's error shows its retirement record), matching suppressions to their rule's shape, and canonical paths are checked by the loader; suppressions naming things that no longer exist are the stale-suppression rule."

[types.Config]
type = "record"

[types.Config.fields.analysis]
type = "Analysis"
required = false

[types.Config.fields.rules]
type = "map"
required = false
key_pattern = "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
order = "incidental"
[types.Config.fields.rules.value]
type = "RuleConfig"

[types.Config.fields.python_tools]
type = "map"
required = false
key_pattern = "^(lint|format|type-check)$"
order = "incidental"
description = "Which command each Python tool rule runs over which paths, keyed by the rule. A declaration says only what runs; whether the rule runs, and for which members, is its strictcode:<rule> option."
[types.Config.fields.python_tools.value]
type = "PythonTool"

[types.Config.fields.strictspec_certificate]
type = "StrictspecCertificate"
required = false
description = "The strictspec diff certificate the strictspec-certificate rule checks, and the adjudication file discharging its unsupported claims. Declaring it switches nothing: the rule runs while its strictcode:strictspec-certificate option is on."

[types.Analysis]
type = "record"
description = "Explicit analysis-mode selection. The presence of a mode key IS the choice; a configured mode that cannot run is a hard error, never a downgrade."

[types.Analysis.fields.python_call_resolution]
type = "enum"
required = false
values = ["syntactic", "type-checker"]
description = "Python call-resolution layer (see stricttools/docs/call-resolution.md). Absent = the always-on syntactic layer only; type-checker requires python_type_checker."

[types.Analysis.fields.python_type_checker]
type = "enum"
required = false
values = ["pyright", "ty"]
description = "Which external type checker backs type-checker mode. Mandatory with python_call_resolution = type-checker; forbidden with syntactic."

[[types.Analysis.constraints]]
form = "conditional-required"
field = "python_type_checker"
when = { field = "python_call_resolution", predicate = "equals", value = "type-checker" }

[[types.Analysis.constraints]]
form = "forbidden-when"
field = "python_type_checker"
when = { field = "python_call_resolution", predicate = "equals", value = "syntactic" }

[types.RuleConfig]
type = "record"
description = "A rule's declarations: thresholds, allow lists, and suppressions. A rule is switched on, off, or to another severity only through its strictcode:<rule id> option."

[types.RuleConfig.fields.thresholds]
type = "map"
required = false
key_pattern = "^[a-z][a-z0-9_-]*$"
order = "incidental"
description = "Named integer thresholds for rules that declare them; no current rule declares one."
[types.RuleConfig.fields.thresholds.value]
type = "integer"

[types.RuleConfig.fields.suppressions]
type = "array"
required = false
[types.RuleConfig.fields.suppressions.item]
type = "Suppression"

[types.RuleConfig.fields.allow]
type = "map"
required = false
key_pattern = "^(py|go|ts)$"
order = "incidental"
description = "Per-language allow lists (library-forbidden-imports): entries subtracted from the effective forbidden set, merged with the workspace-level lint_allow list."
[types.RuleConfig.fields.allow.value]
type = "array"
[types.RuleConfig.fields.allow.value.item]
type = "string"
non_empty = true

[types.RuleConfig.fields.forbidden]
type = "map"
required = false
key_pattern = "^(py|go|ts)$"
order = "incidental"
description = "Per-language replacement of the default forbidden-imports list."
[types.RuleConfig.fields.forbidden.value]
type = "array"
[types.RuleConfig.fields.forbidden.value.item]
type = "string"
non_empty = true

[types.Suppression]
type = "record"
description = "One suppression in the rule's natural target shape: path | (project, dep) | modules (cycle member set) | member. The reason is mandatory and non-empty; shape-vs-rule matching is a consumer-native check against the registry."

[types.Suppression.fields.reason]
type = "string"
required = true
non_empty = true

[types.Suppression.fields.path]
type = "string"
required = false
non_empty = true
description = "A file path (Python, TS/JS) or package directory (Go), relative to the workspace root."

[types.Suppression.fields.project]
type = "string"
required = false
non_empty = true

[types.Suppression.fields.dep]
type = "string"
required = false
non_empty = true

[types.Suppression.fields.modules]
type = "array"
required = false
min_len = 2
description = "The set of modules forming one reported import cycle (an SCC has at least two members)."
[types.Suppression.fields.modules.item]
type = "string"
non_empty = true

[types.Suppression.fields.member]
type = "string"
required = false
non_empty = true
description = "A workspace member name."

[[types.Suppression.constraints]]
form = "exactly-one-of"
fields = ["path", "dep", "modules", "member"]

[[types.Suppression.constraints]]
form = "co-presence"
fields = ["project", "dep"]

[types.PythonTool]
type = "record"
description = "One Python tool run: uv run <tool> over paths, in cwd."

[types.PythonTool.fields.paths]
type = "array"
required = true
min_len = 1
description = "What the tool checks, relative to cwd; declared, never inferred from the tool's own configuration."
[types.PythonTool.fields.paths.item]
type = "string"
non_empty = true

[types.PythonTool.fields.cwd]
type = "string"
required = false
non_empty = true
description = "The directory the tool runs in, relative to the workspace root; absent means the workspace root."

[types.StrictspecCertificate]
type = "record"

[types.StrictspecCertificate.fields.certificate]
type = "string"
required = true
non_empty = true
description = "The certificate strictspec diff wrote (JSON), relative to the workspace root."

[types.StrictspecCertificate.fields.adjudication]
type = "string"
required = false
non_empty = true
description = "A committed adjudication file (TOML) discharging the certificate's unsupported claims, relative to the workspace root."

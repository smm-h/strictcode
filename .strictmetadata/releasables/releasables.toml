format_version = 1
repository_layout = "standalone"
release_branches = ["main", "master"]

[[releasables]]
name = "strictcode"
tag_format = "v{version}"
publish_mode = "ci"
hooks = { post_release = ["bash .strictmetadata/release-hooks/strictcode/post-release.sh"] }

[[members]]
path = "."
name = "root"
releasable = "strictcode"
targets = [{ name = "go" }]

[[members.pipelines]]
name = "go"
type = "go"
target = "go"
local = false
artifact = "library"
install_paths = ["./cmd/strictcode"]

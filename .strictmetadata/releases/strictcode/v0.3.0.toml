# The next release of strictcode. Fill in bump and description, then run `rlsbl release run --watch`.
format_version = 2
# How the release moves the version: patch, minor, major, or infra (moved as a patch, recorded as infra).
bump = "minor"
# What this release is, in a sentence or two. Required.
description = "strictcode takes over the source checks rlsbl used to run: rules switched through options, workspace members read from rlsbl's release declarations, the Python tool rules, deps-stale, the strictspec certificate rule, and registry rules for rlsbl to ask; it parses with the cgofree tree-sitter modules, so building it needs only Go."
# Why these changes were made. Optional.
context = ""
# The targets released, and the ones left out; between them they name every target of the releasable's members.
include = ["go"]
exclude = []
release_commit = "cba02a2b5a05325ef4e3d31cd0e4455351f9fb8e"
[released_trees]
"." = "2edc68f84db730877cc8185867cd0ec9c0bc88a4"
